<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş Ekranı — A Enhanced</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #e4e4e7; font-family: Inter, system-ui, sans-serif; overflow: hidden; }

/* ── SPLASH SCREEN ── */
#splash {
  position: fixed; inset: 0;
  background: #0a0a0f;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 100;
  animation: splash-exit 0.8s ease-in-out 4s forwards;
}

@keyframes splash-exit {
  to { opacity: 0; pointer-events: none; transform: scale(1.05); }
}

/* Particle canvas bg */
#particles-canvas {
  position: absolute; inset: 0;
  opacity: 0.6;
}

/* Animated gradient orb */
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  animation: orb-drift 6s ease-in-out infinite;
}
.orb-1 { width: 400px; height: 400px; background: #4c1d9533; top: -100px; left: -100px; animation-delay: 0s; }
.orb-2 { width: 300px; height: 300px; background: #7c3aed22; bottom: -80px; right: -80px; animation-delay: -3s; }
.orb-3 { width: 200px; height: 200px; background: #3730a322; top: 50%; left: 60%; animation-delay: -1.5s; }
@keyframes orb-drift {
  0%,100% { transform: translate(0,0) scale(1); }
  33% { transform: translate(30px,-20px) scale(1.1); }
  66% { transform: translate(-20px,30px) scale(0.9); }
}

/* Main content */
.splash-content {
  position: relative; z-index: 2;
  display: flex; flex-direction: column;
  align-items: center;
  animation: content-rise 1s cubic-bezier(0.22,1,0.36,1) 0.2s both;
}
@keyframes content-rise {
  from { opacity: 0; transform: translateY(40px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Logo ring — triple ring with rotation */
.logo-wrapper {
  position: relative;
  width: 120px; height: 120px;
  margin-bottom: 28px;
}
.ring {
  position: absolute; inset: 0;
  border-radius: 50%;
  border: 2px solid transparent;
}
.ring-1 {
  border-color: #7c3aed88;
  box-shadow: 0 0 30px #7c3aed55, inset 0 0 30px #7c3aed11;
  animation: spin-slow 8s linear infinite;
}
.ring-2 {
  inset: 10px;
  border-color: #a78bfa55;
  border-top-color: #a78bfa;
  animation: spin-slow 5s linear infinite reverse;
}
.ring-3 {
  inset: 22px;
  border-color: #7c3aed33;
  border-bottom-color: #7c3aed;
  animation: spin-slow 3s linear infinite;
}
@keyframes spin-slow { to { transform: rotate(360deg); } }

.logo-core {
  position: absolute;
  inset: 32px;
  background: radial-gradient(circle, #1e1b4b, #0a0a0f);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 40px #7c3aed66;
  font-size: 22px;
}

/* Pulse rings emanating outward */
.pulse-ring {
  position: absolute; inset: -10px;
  border-radius: 50%;
  border: 1px solid #7c3aed44;
  animation: pulse-expand 2.5s ease-out infinite;
}
.pulse-ring:nth-child(2) { animation-delay: 0.8s; }
.pulse-ring:nth-child(3) { animation-delay: 1.6s; }
@keyframes pulse-expand {
  0% { transform: scale(1); opacity: 0.8; }
  100% { transform: scale(1.8); opacity: 0; }
}

/* App name with shimmer */
.app-name {
  font-size: 28px; font-weight: 700;
  letter-spacing: -0.02em;
  color: #e4e4e7;
  position: relative;
  overflow: hidden;
}
.app-name::after {
  content: '';
  position: absolute; top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, #ffffff22, transparent);
  animation: shimmer 3s ease-in-out 1s infinite;
}
@keyframes shimmer { to { left: 200%; } }

.app-tagline {
  font-size: 12px;
  color: #7c3aed;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-top: 6px;
  animation: fade-in-delay 1s ease 0.8s both;
}
@keyframes fade-in-delay { from { opacity: 0; } to { opacity: 1; } }

/* Loading bar */
.loading-track {
  width: 160px; height: 2px;
  background: #27272a;
  border-radius: 1px;
  margin-top: 36px;
  overflow: hidden;
}
.loading-bar {
  height: 100%;
  background: linear-gradient(90deg, #4c1d95, #7c3aed, #a78bfa);
  border-radius: 1px;
  animation: load-fill 3.2s cubic-bezier(0.4,0,0.2,1) 0.5s forwards;
  width: 0%;
}
@keyframes load-fill { to { width: 100%; } }

.loading-text {
  font-size: 11px; color: #52525b;
  margin-top: 10px;
  letter-spacing: 0.05em;
  animation: fade-in-delay 0.5s ease 1s both;
}

/* Floating micro-particles */
.particle {
  position: absolute;
  width: 3px; height: 3px;
  border-radius: 50%;
  background: #7c3aed;
  animation: float-up linear infinite;
  opacity: 0;
}
@keyframes float-up {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.3; }
  100% { transform: translateY(-20px) scale(1); opacity: 0; }
}

/* ── ONBOARDING ── */
#onboarding {
  position: fixed; inset: 0;
  background: #0a0a0f;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 99;
  opacity: 0; pointer-events: none;
  animation: onboard-show 0.8s ease 4.7s forwards;
}
@keyframes onboard-show { to { opacity: 1; pointer-events: all; } }

.onboard-card {
  width: 380px;
  background: #111116;
  border: 1px solid #27272a;
  border-radius: 24px;
  padding: 40px 36px;
  text-align: center;
  box-shadow: 0 0 60px #7c3aed1a, 0 40px 80px #00000088;
  animation: card-rise 0.7s cubic-bezier(0.22,1,0.36,1) 4.9s both;
}
@keyframes card-rise {
  from { transform: translateY(30px) scale(0.96); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}

.onboard-steps {
  display: flex; gap: 8px; justify-content: center; margin-bottom: 32px;
}
.step-dot {
  width: 8px; height: 8px; border-radius: 4px;
  background: #3f3f46;
  transition: all 0.3s;
}
.step-dot.active { background: #7c3aed; width: 24px; }

.onboard-icon {
  width: 72px; height: 72px;
  background: radial-gradient(circle, #1e1b4b, #0f0f1a);
  border: 1px solid #7c3aed44;
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  margin: 0 auto 20px;
  box-shadow: 0 0 24px #7c3aed33;
}
.onboard-title { font-size: 22px; font-weight: 700; color: #e4e4e7; margin-bottom: 10px; }
.onboard-desc { font-size: 14px; color: #71717a; line-height: 1.6; margin-bottom: 28px; }

.onboard-btn {
  width: 100%;
  padding: 14px;
  background: #7c3aed;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 15px; font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  box-shadow: 0 4px 20px #7c3aed55;
}
.onboard-btn:hover { background: #6d28d9; transform: translateY(-1px); }

.onboard-skip {
  font-size: 13px; color: #52525b;
  margin-top: 14px; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px;
}
.onboard-skip:hover { color: #71717a; }

/* App mockup (behind) */
#app-preview {
  position: fixed; inset: 0;
  background: #0f0f11;
  display: flex;
  z-index: 1;
  opacity: 0;
  animation: app-show 0.5s ease 5s forwards;
}
@keyframes app-show { to { opacity: 0.15; } }
.mock-sidebar-bg { width: 220px; background: #111116; border-right: 1px solid #1c1c1f; }
.mock-main-bg { flex: 1; padding: 20px; }
.mock-header { height: 40px; background: #1a1a1f; border-radius: 8px; margin-bottom: 12px; }
.mock-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.mock-widget { height: 80px; background: #1a1a1f; border-radius: 8px; opacity: 0.5; }
</style>
</head>
<body>

<!-- App blurred behind -->
<div id="app-preview">
  <div class="mock-sidebar-bg"></div>
  <div class="mock-main-bg">
    <div class="mock-header"></div>
    <div class="mock-grid">
      <div class="mock-widget"></div>
      <div class="mock-widget"></div>
      <div class="mock-widget"></div>
      <div class="mock-widget"></div>
      <div class="mock-widget"></div>
      <div class="mock-widget"></div>
    </div>
  </div>
</div>

<!-- SPLASH -->
<div id="splash">
  <!-- Ambient orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Floating particles (JS generated) -->
  <div id="particle-field"></div>

  <div class="splash-content">
    <div class="logo-wrapper">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <div class="logo-core">📅</div>
    </div>

    <div class="app-name">Günlük Takip</div>
    <div class="app-tagline">Kişisel Üretkenlik</div>

    <div class="loading-track">
      <div class="loading-bar"></div>
    </div>
    <div class="loading-text">Hazırlanıyor...</div>
  </div>
</div>

<!-- ONBOARDING (appears after splash) -->
<div id="onboarding">
  <div class="onboard-card">
    <div class="onboard-steps">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>
    <div class="onboard-icon">👋</div>
    <div class="onboard-title">Hoş Geldin!</div>
    <div class="onboard-desc">Günlük Takip ile görevlerini, alışkanlıklarını ve hedeflerini tek bir yerden yönet.</div>
    <button class="onboard-btn">Devam Et →</button>
    <div class="onboard-skip">Geç</div>
  </div>
</div>

<script>
// Generate floating particles
const field = document.getElementById('particle-field');
for (let i = 0; i < 25; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.cssText = `
    left: ${Math.random() * 100}%;
    animation-duration: ${4 + Math.random() * 6}s;
    animation-delay: ${Math.random() * 4}s;
    width: ${1 + Math.random() * 3}px;
    height: ${1 + Math.random() * 3}px;
    opacity: ${0.2 + Math.random() * 0.5};
  `;
  field.appendChild(p);
}
</script>
</body>
</html>
